# Admin routelarni SPA uchun qayta yo‘naltirish
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Chat yoki boshqa SPA routelar uchun umumiy qayta yo‘naltirish
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

